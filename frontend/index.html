<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Taxi Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>NYC Taxi Dashboard</h1>
  </header>

  <main>
    <div id="summary"></div>

    <div class="section-row">
      <div class="card" id="top-zones-card">
        <h2>Top Pickup Zones</h2>
        <div id="topZones"></div>
      </div>

      <div class="card" id="borough-card">
        <h2>Borough Activity</h2>
        <div id="boroughChart"></div>
      </div>
    </div>

    <div class="card">
      <h2>Hourly Trip Demand</h2>
      <div id="hourlyChart"></div>
    </div>

    <div class="card">
      <h2>Trips</h2>
      <div class="filters">
        <label>
          Borough
          <select id="boroughFilter">
            <option value="all">All boroughs</option>
            <option value="Bronx">Bronx</option>
            <option value="Brooklyn">Brooklyn</option>
            <option value="Manhattan">Manhattan</option>
            <option value="Queens">Queens</option>
            <option value="Staten Island">Staten Island</option>
          </select>
        </label>
        <label>
          Sort by
          <select id="sortFilter">
            <option value="fare">Fare</option>
            <option value="distance">Distance</option>
            <option value="time">Pickup time</option>
          </select>
        </label>
        <label>
          Min distance
          <input id="minDistance" type="number" min="0" step="0.5" placeholder="0" />
        </label>
        <label>
          Max distance
          <input id="maxDistance" type="number" min="0" step="0.5" placeholder="25" />
        </label>
        <button id="applyFilters">Apply</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pickup</th>
              <th>Dropoff</th>
              <th>Distance</th>
              <th>Fare</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="tripTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
